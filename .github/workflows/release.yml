name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.5). Leave empty to release whatever was just pushed.'
        required: false

permissions:
  contents: write   # to push the updated worker/public/teramera.apk
  packages: read

jobs:
  release:
    runs-on: macos-latest    # matches the dev machine; AGP 9 + JDK 17 + Android SDK 37
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolving ${{ steps.tag.outputs.name }}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `api-level` / `build-tools-version` are not inputs of this action (it warned
      # and ignored them); `packages` is. Asking for the retired `tools` package made
      # sdkmanager exit 1 and failed the v0.3.9 run, so install only what the hosted
      # image doesn't already ship.
      - name: Setup Android SDK (compileSdk 37)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Caches ~/.gradle between runs; saves ~1-2 min on subsequent releases.
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'worker/wrangler.jsonc') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Wrapper expects local.properties; we don't need real values for `assembleDebug`,
      # but the file must exist because Google Sign-In keys are wired through it.
      - name: Stub local.properties
        run: |
          mkdir -p ~/.android
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          google.webClientId=${{ vars.GOOGLE_WEB_CLIENT_ID || '' }}
          EOF
          echo "local.properties written"

      - name: Sanity — versionCode must have changed since the previous tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CURRENT_VC=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          echo "Current versionCode=${CURRENT_VC}"

          # Sort existing release tags and pick the most recent v* tag (excluding ours).
          PREV_TAG=$(gh release list --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]' | grep -v "^${{ steps.tag.outputs.name }}$" | head -1 || true)
          echo "Previous release tag: ${PREV_TAG:-none}"

          if [ -z "${PREV_TAG}" ]; then
            echo "First release — nothing to compare against."
            exit 0
          fi

          PREV_VC=$(git show "${PREV_TAG}:app/build.gradle.kts" 2>/dev/null \
            | grep -E '^\s*versionCode\s*=' \
            | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' \
            | head -1)
          PREV_VC=${PREV_VC:-0}
          echo "Previous versionCode=${PREV_VC}"

          if [ "${CURRENT_VC}" -le "${PREV_VC}" ]; then
            echo "::error::versionCode ${CURRENT_VC} is not greater than previous tag ${PREV_TAG}'s ${PREV_VC}. Bump it in app/build.gradle.kts."
            exit 1
          fi

      # The published APK must be signed with the release key, otherwise every
      # in-app update installs a build Android won't accept over the old one.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — refusing to publish an unsigned APK. Add ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teramera-release.jks"
          ls -la "$RUNNER_TEMP/teramera-release.jks"

      - name: Build signed release APK
        env:
          # app/build.gradle.kts reads this when google.webClientId is missing
          # from local.properties and ~/.gradle/gradle.properties. The repo
          # variable is intentionally public (the web client id is on every
          # signed-in APK's manifest).
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '' }}
          KEYSTORE_PATH: ${{ runner.temp }}/teramera-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Verify APK signature
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" || { echo "::error::release APK is not signed"; exit 1; }

      - name: Ship APK into worker assets
        run: |
          mkdir -p worker/public
          cp app/build/outputs/apk/release/app-release.apk worker/public/teramera.apk
          ls -la worker/public/teramera.apk

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing — skipping wrangler deploy. Asset uploaded via gh release below."
            exit 0
          fi
          # best-effort: a stale OAuth token will fail with 'Authentication
          # error [code: 10000]'. Warn and continue so the release + APK ship
          # still succeed; re-deploy manually after refreshing the token.
          if ! npx --yes wrangler deploy; then
            echo "::warning::wrangler deploy failed (likely an expired OAuth token). Re-run after refreshing CLOUDFLARE_API_TOKEN."
          fi

      - name: Commit updated worker APK
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet worker/public/teramera.apk; then
            echo "worker/public/teramera.apk unchanged; nothing to commit"
          else
            # workflow checked out the tag as a detached HEAD; fast-forward main
            # to that commit and push the APK update on top.
            git add worker/public/teramera.apk
            git commit -m "release: ship ${{ steps.tag.outputs.name }} APK to worker/public"
            git fetch origin main
            # rebase the APK commit onto the current tip of main so the push is fast-forward
            HEAD_SHA=$(git rev-parse HEAD)
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<EOF
          v${{ steps.tag.outputs.name }} — signed release build.

          Built on macos-latest, signed with the teramera release key, and deployed via wrangler
          (if secrets are configured). The Worker serves \`/teramera.apk\` from this build; existing
          apps detect it via \`/app/version\`.
          EOF
          )
          # Same bytes under two names: `teramera.apk` (what the Worker serves)
          # and `teramera-release.apk` (the artifact, clearly labelled).
          gh release create "${{ steps.tag.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.tag.outputs.name }}" \
            --notes "${NOTES}" \
            worker/public/teramera.apk#teramera.apk \
            app/build/outputs/apk/release/app-release.apk#teramera-release.apk